services:
  navichno:
    image: nginx:stable-alpine
    container_name: navichno-test
    ports:
      - "8088:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    restart: unless-stopped

  bot:
    build: ./bot
    container_name: navichno-bot
    env_file: ./bot/.env
    volumes:
      - ./bot/data:/data
    restart: unless-stopped
